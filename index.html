<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1st Anniversary</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <p class="badge">1UP</p>
  <h1>HAPPY<br>1ST ANNIVERSARY</h1>
  <p class="days">우리가 함께한 지 <b id="days">0</b>일째</p>
  <a class="btn" href="#game">▶ PRESS START</a>
</header>

<main>
<section id="game">
  <h2>STAGE 1 · 코인 러너</h2>
  <p class="hint">스페이스 / 클릭 / 터치로 점프! 코인을 모으고 장애물을 피하세요.</p>
  <div class="screen"><canvas id="cv" width="640" height="220"></canvas></div>
  <p class="score">SCORE <b id="sc">0</b> &nbsp; BEST <b id="best">0</b></p>
</section>

<section id="maker">
  <h2>STAGE 2 · 캐릭터 만들기</h2>
  <p class="hint">16×16 도트를 찍어 나만의 캐릭터를 만들고 PNG로 저장하세요.</p>
  <div class="maker">
    <canvas id="ed" width="320" height="320"></canvas>
    <div class="tools">
      <div id="pal" class="pal"></div>
      <div class="row">
        <button data-t="pen" class="on">✏️ 펜</button>
        <button data-t="erase">🧽 지우개</button>
        <button data-t="fill">🪣 채우기</button>
      </div>
      <div class="row">
        <button id="clr">전체 지우기</button>
        <button id="save" class="btn">💾 PNG 저장</button>
      </div>
    </div>
  </div>
</section>

<section id="guest">
  <h2>FINAL STAGE · 방명록</h2>
  <form id="gf">
    <input id="gn" maxlength="12" placeholder="이름" required>
    <textarea id="gm" maxlength="120" placeholder="축하 메시지를 남겨주세요" required></textarea>
    <button class="btn">✉ 남기기</button>
  </form>
  <p id="gstat" class="hint"></p>
  <ul id="gl"></ul>
</section>
</main>

<footer>© 1st Anniversary · THANK YOU FOR PLAYING</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
