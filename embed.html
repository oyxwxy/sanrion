/* =========================================================
   SANTA ♥ ORION — 1ST ANNIVERSARY
   흰색 · 분홍 / Y2K 스티커 · 하프톤 · 레이스 픽셀 테마
   ========================================================= */
.px-app {
  --bg: #fbe6ef; --dot: #f4c3d5; --paper: #ffffff; --paper2: #fdf1f6;
  --ink: #3a1d2e; --ink2: #6e3d58; --mute: #b07c93; --line: #f3cbda;

  --font-serif: &quot;MaruBuri-Regular&quot;, serif;
  --font-hand: &quot;Handletter&quot;, &quot;KyoboHandwriting2020A&quot;, sans-serif;
  --sticker:
    0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink),
    0 -9px 0 0 #fff, 0 9px 0 0 #fff, -9px 0 0 0 #fff, 9px 0 0 0 #fff,
    -6px -6px 0 0 #fff, 6px -6px 0 0 #fff, -6px 6px 0 0 #fff, 6px 6px 0 0 #fff,
    6px 15px 0 0 rgba(184, 58, 107, .16);
  --ring2: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink);
  --ring3: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);

  position: relative; max-width: 860px; margin: 0 auto; padding: 0 24px 44px; min-height: 720px;
  font-family: var(--font); font-size: 14px; line-height: 1.6; color: var(--ink);
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 0 0, rgba(255, 255, 255, .9), transparent 38%),
    radial-gradient(circle at 100% 100%, rgba(248, 191, 211, .8), transparent 42%),
    radial-gradient(var(--dot) 1.3px, transparent 1.7px);
  background-size: auto, auto, 9px 9px;
  overflow: hidden; -webkit-font-smoothing: none; box-sizing: border-box;
}
.px-app *, .px-app *::before, .px-app *::after { box-sizing: border-box; }
.px-app canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
:where(.px-app) button { font-family: inherit; color: inherit; cursor: pointer; }
.px-app h2 { margin: 0; font: 400 22px/1.1 var(--font-h); letter-spacing: .02em; }
.px-app &gt; header, .px-app &gt; nav, .px-app &gt; main, .px-app &gt; footer, .px-app &gt; .marquee { position: relative; z-index: 1; }
.px-app::after {
  content: &quot;&quot;; position: absolute; left: 0; right: 0; bottom: 0; height: 16px; z-index: 1;
  background-image: var(--lace); background-size: 32px 16px; background-repeat: repeat-x;
  image-rendering: pixelated; transform: scaleY(-1); filter: drop-shadow(0 2px 0 var(--pink-l));
}
.decor { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.decor i { position: absolute; width: 15px; height: 15px; background-size: 100% 100%; image-rendering: pixelated; animation: twinkle 2s steps(2) infinite; }
.decor i.big { width: 20px; height: 20px; }
@keyframes twinkle { 50% { opacity: .25; transform: scale(.8); } }

  clip-path: polygon(0 20%, 20% 0, 40% 0, 50% 15%, 60% 0, 80% 0, 100% 20%, 100% 55%, 50% 100%, 0 55%); }

/* 마퀴 (상단 띠) */
.marquee {
  margin: 0 -24px 22px; height: 30px; overflow: hidden; white-space: nowrap;
  background: var(--pink); color: #fff; font: 13px/30px var(--font-h); letter-spacing: .08em;

/* ---------- 스티커 박스 / 버튼 / 입력 ---------- */
.px-box { background: var(--paper); box-shadow: var(--sticker); margin: 9px; }
.px-frame { background: var(--ink); padding: 3px; box-shadow: var(--sticker); margin: 9px; }

.px-btn:active { transform: translateY(2px); box-shadow: var(--ring3); }
.px-btn.ghost { background: #fff; color: var(--ink); box-shadow: var(--ring3), inset 0 -3px 0 0 var(--line); }
.px-btn.ghost:hover { background: var(--paper2); }
.px-btn.p1 { background: var(--p1); box-shadow: var(--ring3), inset 0 -3px 0 0 var(--p1-d); }
.px-btn.p2 { background: var(--p2); box-shadow: var(--ring3), inset 0 -3px 0 0 var(--p2-d); }
.px-btn.sm { padding: 5px 10px 7px; font-size: 12px; }

.px-btn:focus-visible, .chip:focus-visible, .stage-tab:focus-visible, .tool:focus-visible, .xs-btn:focus-visible, .sw:focus-visible { outline: 2px dashed var(--pink); outline-offset: 5px; }

/* ---------- 입장 인트로 ---------- */
.intro {
  position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 18px; padding: 70px 20px 20px;

.intro.show-title .intro-title { opacity: 1; transform: none; }

.it-kicker .hrt { color: var(--pink-l); }
.it-main {
  display: block; margin: 6px 0 2px; font: 400 clamp(46px, 11vw, 92px)/1 var(--font-display); color: var(--pink); letter-spacing: .02em;

.intro-skip:hover { background: var(--pink); }

/* ---------- 상단 ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { width: 34px; height: 34px; flex: none; margin: 6px; box-shadow: var(--sticker);
  background: linear-gradient(var(--pink), var(--pink)) 13px 5px / 9px 24px no-repeat, linear-gradient(var(--pink), var(--pink)) 9px 9px / 4px 4px no-repeat, linear-gradient(var(--pink), var(--pink)) 9px 25px / 17px 4px no-repeat, #fff; }

.sound-btn.is-off i { background:

  linear-gradient(var(--ink), var(--ink)) 6px 1px / 2px 14px no-repeat, linear-gradient(var(--mute), var(--mute)) 11px 5px / 2px 2px no-repeat,
  linear-gradient(var(--mute), var(--mute)) 13px 7px / 2px 2px no-repeat, linear-gradient(var(--mute), var(--mute)) 15px 9px / 2px 2px no-repeat,
  linear-gradient(var(--mute), var(--mute)) 15px 5px / 2px 2px no-repeat, linear-gradient(var(--mute), var(--mute)) 11px 9px / 2px 2px no-repeat; }

/* ---------- 스테이지 탭 ---------- */
.stages { display: flex; align-items: center; margin: 0 4px 28px; }
.stage-path { flex: 1; height: 4px; min-width: 6px; background: repeating-linear-gradient(90deg, var(--pink-l) 0 4px, transparent 4px 8px); }

  box-shadow: 0 -3px 0 0 var(--pink-l), 0 3px 0 0 var(--pink-l), -3px 0 0 0 var(--pink-l), 3px 0 0 0 var(--pink-l); }
.stage-tab.is-cleared { color: var(--ink2); }

/* ---------- 스테이지 공통 ---------- */
.stage { display: none; }
.stage.is-active { display: block; animation: stageIn .35s steps(4); }
@keyframes stageIn { from { opacity: 0; transform: translateY(8px); } }
.stage-title { position: relative; display: flex; align-items: center; gap: 12px; margin: 0 6px 22px; min-height: 40px; }

.stage-title h2 { position: relative; z-index: 1; }
.stage-title small { font: 12px var(--font); color: var(--mute); }
.st-big {
  position: absolute; right: -6px; top: 50%; transform: translateY(-58%) rotate(-3deg); z-index: 0; pointer-events: none;
  font: 400 64px/1 var(--font-wide); letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 2px var(--pink-l); opacity: .9;
}
.stage-actions { display: flex; justify-content: flex-end; margin-top: 28px; }

/* ---------- STAGE 1 ---------- */
.scene canvas { width: 100%; height: auto; aspect-ratio: 192/108; cursor: pointer; }
.dlg { position: relative; margin-top: 26px; padding: 20px 22px 12px; min-height: 120px; cursor: pointer; user-select: none; }
.dlg-speaker { position: absolute; top: -15px; left: 14px; padding: 2px 10px; font: 12px var(--font-h); letter-spacing: .08em; background: var(--pink); color: #fff; box-shadow: 0 0 0 2px var(--ink); }
.dlg-skip { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 11px; color: var(--mute); letter-spacing: .1em; }
.dlg-skip:hover { color: var(--pink); }
.dlg-text { margin: 4px 0 8px; font: 17px/1.75 var(--font-h); min-height: 58px; word-break: keep-all; }
.dlg-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--mute); }
.dlg-arrow { width: 10px; height: 6px; opacity: 0; background: linear-gradient(var(--pink), var(--pink)) 0 0 / 10px 2px no-repeat, linear-gradient(var(--pink), var(--pink)) 2px 2px / 6px 2px no-repeat, linear-gradient(var(--pink), var(--pink)) 4px 4px / 2px 2px no-repeat; }

.profiles { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }

.profile-av-wrap canvas { width: 88px; height: 88px; }

.profile-slot { display: inline-block; font: 11px var(--font-h); letter-spacing: .12em; color: #fff; background: var(--pc); padding: 1px 7px; }
.profile-code { display: block; font: 400 26px/1.15 var(--font-h); color: var(--pc); letter-spacing: .04em; margin: 4px 0 6px; }

.profile dt { color: var(--mute); font-size: 11px; padding-top: 2px; }
.profile dd { margin: 0; }
.profile-quote { margin: 0; padding: 10px 12px; font: 15px/1.6 var(--font-serif); color: var(--ink); background: var(--paper2); border-left: 3px solid var(--pc); word-break: keep-all; }
.kw-list { display: flex; flex-wrap: wrap; gap: 6px; }
.kw { font: 12px var(--font-read); padding: 2px 8px; color: var(--pink-d); background: #fff; box-shadow: 0 0 0 2px var(--pink-l); }
.profile .kw { color: var(--pc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--pc) 25%, #fff); }
.profile-open { align-self: flex-start; margin-top: auto; background: var(--pc); box-shadow: var(--ring3), inset 0 -3px 0 0 rgba(0, 0, 0, .25); }
.profile-open:hover { background: var(--pc); filter: brightness(1.08); }
.profile-heart { width: 26px; height: 24px; background: var(--pink); align-self: center; justify-self: center;
  clip-path: polygon(0 16%, 16% 0, 42% 0, 50% 12%, 58% 0, 84% 0, 100% 16%, 100% 50%, 50% 100%, 0 50%); animation: hop 1s steps(2) infinite; }

/* ---------- 모달 (레트로 창) ---------- */
.xmodal { position: absolute; inset: 0; z-index: 80; background: rgba(58, 29, 46, .45); padding: 0 16px 40px; display: flex; justify-content: center; align-items: flex-start; animation: fadeIn .2s steps(3); }
.xmodal.out { opacity: 0; transition: opacity .2s steps(3); }
@keyframes fadeIn { from { opacity: 0; } }
.xm-win { width: min(640px, 100%); background: #fff; box-shadow: var(--sticker); margin: 9px; }
.xm-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px 6px 12px; background: var(--pink); color: #fff; font: 12px var(--font-h); letter-spacing: .04em; box-shadow: inset 0 -3px 0 0 var(--pink-d); }
.xm-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.xm-close:hover { background: var(--ink); color: #fff; }
.xm-body { padding: 18px 20px 20px; overflow-y: auto; overscroll-behavior: contain; }

.doc { --pc: var(--pink); }
.doc-head { display: flex; gap: 14px; align-items: center; padding-bottom: 14px; border-bottom: 2px dashed var(--line); }
.doc-av { padding: 3px; background: var(--ink); } .doc-av canvas { width: 72px; height: 72px; }
.doc-who { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }

  background-image: repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px); box-shadow: var(--ring2), 5px 7px 0 0 var(--pink-l); margin: 4px; }

/* ---------- 위젯 ---------- */

.xselect { position: relative; display: inline-block; min-width: 170px; }

.cpick { position: absolute; z-index: 90; width: 212px; padding: 10px; background: #fff; box-shadow: var(--sticker); outline: none; }

.cp-hex { display: flex; align-items: center; flex: 1; box-shadow: var(--ring2); margin: 2px; background: #fff; }
.cp-hex span { padding: 0 2px 0 6px; color: var(--mute); }
.cp-hex input { width: 100%; height: 26px; border: 0; outline: none; font: 13px var(--font); text-transform: uppercase; color: var(--ink); background: transparent; }
.cp-rgb { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.cp-ch { display: flex; align-items: center; gap: 6px; font: 11px var(--font-h); color: var(--ink2); }
.cp-ch &gt; span { width: 12px; }
.cp-label { font-size: 10px; color: var(--mute); margin: 8px 0 3px; letter-spacing: .06em; }
.cp-sw { display: flex; flex-wrap: wrap; gap: 4px; min-height: 18px; }
.cp-btns { display: flex; justify-content: flex-end; gap: 4px; margin-top: 10px; }

/* ---------- STAGE 2 : 가로 콘솔 ---------- */
.stage[data-stage=&quot;2&quot;].is-active { display: block; }
.handheld {
  position: relative; display: grid; grid-template-columns: 116px 1fr 116px; gap: 10px; align-items: center;
  padding: 18px 16px 20px; margin: 9px 9px 28px; background: #fff; border-radius: 26px;
  box-shadow: inset 0 -7px 0 0 #f3d3df, inset 0 4px 0 0 #fff, 0 0 0 3px var(--ink), 0 0 0 10px #fff, 0 0 0 13px var(--pink), 10px 20px 0 10px rgba(184, 58, 107, .16);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.hh-left, .hh-right { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.hh-center { min-width: 0; }
.hh-top { display: flex; align-items: center; gap: 6px; padding: 5px 12px; margin-bottom: 8px; background: var(--pink); color: #fff; font: 10px var(--font-h); letter-spacing: .12em; border-radius: 8px 8px 0 0; box-shadow: inset 0 -3px 0 0 var(--pink-d); }
.hh-led { width: 8px; height: 8px; background: #8a2a50; }
.stage[data-stage=&quot;2&quot;].is-active .hh-led { background: #fff; box-shadow: 0 0 6px #fff; }
.hh-label { margin-left: auto; }
.hh-p { padding: 0 5px; color: #fff; } .hh-p.p1 { background: var(--p1); margin-left: 8px; } .hh-p.p2 { background: var(--p2); }
.hh-bezel { background: #5a2c45; padding: 14px; border-radius: 0 0 14px 14px; box-shadow: inset 0 -4px 0 0 #43203a, inset 0 3px 0 0 #6e3d58; }
.gb-canvas { width: 100%; height: auto; aspect-ratio: 256/144; box-shadow: 0 0 0 2px #2c1022; cursor: pointer; }
.dpad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); }
.dpad button, .dpad .d-mid { border: 0; background: var(--pink); padding: 0; position: relative; }
.dpad .d-up { grid-area: 1 / 2; border-radius: 6px 6px 0 0; } .dpad .d-left { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }
.dpad .d-mid { grid-area: 2 / 2; } .dpad .d-right { grid-area: 2 / 3; border-radius: 0 6px 6px 0; }
.dpad .d-down { grid-area: 3 / 2; border-radius: 0 0 6px 6px; box-shadow: inset 0 -4px 0 0 var(--pink-d); }
.dpad { filter: drop-shadow(0 0 0 var(--ink)) drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)); }
.dpad .d-mid::after { content: &quot;&quot;; position: absolute; inset: 11px; border-radius: 50%; background: var(--pink-d); }
.dpad button::after { content: &quot;&quot;; position: absolute; left: 50%; top: 50%; border: 5px solid transparent; transform: translate(-50%, -50%); }
.d-up::after { border-bottom-color: #fff !important; margin-top: -3px; } .d-down::after { border-top-color: #fff !important; margin-top: 1px; }
.d-left::after { border-right-color: #fff !important; margin-left: -3px; } .d-right::after { border-left-color: #fff !important; margin-left: 3px; }
.dpad button.is-down { background: var(--pink-d); }
.hh-dots { display: grid; grid-template-columns: repeat(3, 16px); gap: 6px; padding: 8px; background: #fff; box-shadow: var(--ring2); border-radius: 4px; }
.hh-dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--pink-l); box-shadow: inset 0 -3px 0 0 rgba(0, 0, 0, .12), 0 0 0 2px var(--ink); }
.hh-dots i.p1 { background: var(--p1); } .hh-dots i.p2 { background: var(--p2); }
.ss-row { display: flex; gap: 10px; }
.ss { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ss button { width: 40px; height: 12px; border: 0; border-radius: 6px; background: var(--pink-l); box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 0 #e79ab7; }
.ss button.is-down { background: #e79ab7; }
.ss small { font: 9px var(--font-h); letter-spacing: .08em; color: var(--ink2); }
.ab { display: flex; gap: 10px; align-items: center; transform: rotate(-18deg); }
.ab button { width: 48px; height: 48px; border: 0; border-radius: 50%; color: #fff; font: 400 15px var(--font-h); }
.ab button span { display: block; transform: rotate(18deg); }
.ab .btn-a { background: var(--p1); box-shadow: inset 0 -5px 0 0 var(--p1-d), 0 0 0 3px var(--ink); margin-top: -18px; }
.ab .btn-b { background: var(--p2); box-shadow: inset 0 -5px 0 0 var(--p2-d), 0 0 0 3px var(--ink); margin-top: 18px; }
.ab button.is-down { transform: translateY(2px); box-shadow: inset 0 2px 0 0 rgba(0, 0, 0, .25), 0 0 0 3px var(--ink); }
.hh-coin { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px 10px; background: #fff; box-shadow: var(--ring2); border-radius: 4px; }
.hh-coin small { font: 8px var(--font-h); letter-spacing: .08em; color: var(--pink-d); }
.hh-coin i { width: 8px; height: 22px; border-radius: 4px; background: var(--ink); box-shadow: 0 0 0 4px var(--pink-l); }
.grill { display: grid; grid-template-columns: repeat(4, 5px); gap: 6px; }
.grill i { width: 5px; height: 5px; border-radius: 50%; background: var(--pink-l); }
.game-side { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.awards { grid-column: 1 / -1; padding: 12px 16px 14px; }
.game-help { padding: 14px 16px; }
.game-help b { display: block; font: 400 17px var(--font-h); margin-bottom: 6px; color: var(--pink-d); }
.game-help p { margin: 0; font: 14px/1.7 var(--font-read); word-break: keep-all; }
.keys { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.keys div { display: flex; align-items: center; gap: 4px; }
.keys span { margin-left: auto; color: var(--ink2); }
kbd { font: 10px var(--font); padding: 1px 6px 2px; margin: 2px; background: var(--paper2); color: var(--ink); box-shadow: var(--ring2), inset 0 -2px 0 0 var(--line); }

/* ---------- STAGE 3 : 메이커 ---------- */
.maker { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 20px 28px; align-items: start; }
.mk-canvas-wrap { position: relative; background-color: #fff; background-image: linear-gradient(45deg, #fbe1eb 25%, transparent 25%, transparent 75%, #fbe1eb 75%), linear-gradient(45deg, #fbe1eb 25%, transparent 25%, transparent 75%, #fbe1eb 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; background-clip: content-box; }
.mk-canvas { width: 100%; height: auto; aspect-ratio: 1; touch-action: none; }
.mk-canvas.is-painting { cursor: crosshair; }
.mk-gridline { position: absolute; inset: 3px; pointer-events: none; opacity: 0; background-image: linear-gradient(rgba(58, 29, 46, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(58, 29, 46, .12) 1px, transparent 1px); background-size: calc(100% / 32) calc(100% / 32); }
.grid-on .mk-gridline { opacity: 1; }
.mk-tools { display: flex; align-items: center; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
.mk-tools-2 { margin-top: 10px; gap: 4px; }
.tool { display: flex; align-items: center; gap: 5px; border: 0; padding: 5px 8px 6px; margin: 2px; font-size: 12px; background: #fff; box-shadow: var(--ring2); }
.tool.is-on { background: var(--pink); color: #fff; }
.tool-s { min-width: 30px; height: 30px; border: 0; padding: 0 6px; margin: 2px; font-size: 14px; background: #fff; box-shadow: var(--ring2); }
.tool-s:hover:not(:disabled), .tool:not(.is-on):hover { background: var(--paper2); }
.tool-s:disabled { opacity: .35; cursor: default; }
.mk-sep { width: 2px; height: 22px; background: var(--line); margin: 0 2px; }
.ico { width: 12px; height: 12px; display: inline-block; background-color: currentColor; }
.ico-pen { clip-path: polygon(0 100%, 0 75%, 66% 8%, 92% 34%, 25% 100%); }
.ico-eraser { clip-path: polygon(0 66%, 50% 16%, 100% 50%, 58% 92%, 16% 92%); }
.ico-picker { clip-path: polygon(0 100%, 0 84%, 50% 34%, 34% 16%, 66% 0, 100% 34%, 84% 66%, 66% 50%, 16% 100%); }
.mk-presets { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 0 4px 14px; font-size: 11px; color: var(--mute); }
.mk-presets &gt; span { margin-right: 6px; letter-spacing: .06em; }
.mk-tabs { display: flex; flex-wrap: wrap; margin: 0 4px; }
.mk-tab { border: 0; padding: 6px 11px 8px; font-size: 13px; background: var(--paper2); color: var(--mute); box-shadow: inset 0 -2px 0 0 var(--ink), inset 2px 0 0 0 var(--line); }
.mk-tab:first-child { box-shadow: inset 0 -2px 0 0 var(--ink); }
.mk-tab.is-on { background: #fff; color: var(--pink-d); box-shadow: inset 0 2px 0 0 var(--ink), inset 2px 0 0 0 var(--ink), inset -2px 0 0 0 var(--ink); }
.mk-panel { padding: 12px 16px 14px; background: #fff; box-shadow: 0 0 0 2px var(--ink), 0 0 0 8px #fff, 6px 12px 0 4px rgba(184, 58, 107, .14); margin: 0 4px; }
.mk-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 2px dotted var(--line); }
.mk-row:last-child { border-bottom: 0; }
.mk-label { font-size: 12px; color: var(--ink2); padding-top: 6px; }
.mk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; padding: 4px 9px 5px; margin: 2px; font-size: 12px; background: #fff; box-shadow: 0 -2px 0 0 var(--line), 0 2px 0 0 var(--line), -2px 0 0 0 var(--line), 2px 0 0 0 var(--line); }
.chip:hover { box-shadow: var(--ring2); }
.chip.is-on { background: var(--pink); color: #fff; box-shadow: var(--ring2); }
.mk-swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { position: relative; width: 24px; height: 24px; border: 0; padding: 0; margin: 2px; background: var(--c, #fff); box-shadow: 0 0 0 2px var(--ink), inset 0 -3px 0 0 rgba(0, 0, 0, .12); display: inline-block; cursor: pointer; }
.sw.sm { width: 16px; height: 16px; margin: 1px; box-shadow: 0 0 0 1px var(--ink); }
.sw.is-on::after { content: &quot;&quot;; position: absolute; inset: -6px; box-shadow: 0 0 0 2px var(--pink); }
.sw-custom { background: conic-gradient(from 0deg, #c8323f, #d9a441, #1f8f63, #a8e6dc, #7a5ea8, #e0578a, #c8323f); }
.sw-custom.is-on { background: var(--c); }
.sw-custom::before { content: &quot;+&quot;; position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: #fff; text-shadow: 1px 1px 0 var(--ink); pointer-events: none; }
.hex-tag { font-size: 11px; color: var(--mute); margin-left: 6px; letter-spacing: .04em; }
.paint-color { width: 30px; height: 30px; }
.mk-keys { margin: 22px 4px 0; font-size: 11px; color: var(--mute); line-height: 1.7; word-break: keep-all; }
.mk-keys b { color: var(--ink2); font-weight: 400; margin-right: 4px; }

/* ---------- STAGE 4 : 폴라로이드 ---------- */
.pola { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px 30px; align-items: start; }
.pl-wrap { padding: 0; transform: rotate(-1.5deg); box-shadow: 0 0 0 2px var(--ink), 8px 14px 0 2px rgba(184, 58, 107, .18); margin: 10px 6px 4px; }
.pl-cv { width: 100%; height: auto; aspect-ratio: 600/720; touch-action: none; image-rendering: auto; }
.pl-selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 18px; }
.pl-selbar .sel-only { opacity: .35; pointer-events: none; }
.pl-selbar.on .sel-only { opacity: 1; pointer-events: auto; }
.pl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pl-grid.stickers { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
.pl-add { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; padding: 8px 4px 6px; background: #fff; font-size: 11px; box-shadow: 0 0 0 2px var(--line); margin: 2px; }

.pl-props-head { font: 12px var(--font-h); color: var(--pink-d); letter-spacing: .04em; margin-bottom: 2px; }
.pl-props textarea { min-height: 54px; }

/* ---------- STAGE 5 : 쪽지 병 ---------- */
.bt { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px 30px; align-items: start; }
.bt-left { display: flex; flex-direction: column; align-items: center; }

.bt-ctrl { display: flex; align-items: center; gap: 10px; margin-top: 6px; }

.bt-status { margin: 10px 0 0; font-size: 13px; color: var(--mute); text-align: center; }
.bt-status:empty { display: none; }
.bt-hint { text-align: center; }
.bt-form { padding: 16px 18px 18px; }
.bt-form-head { display: flex; align-items: center; justify-content: space-between; font: 13px var(--font-h); letter-spacing: .12em; color: var(--pink-d); margin-bottom: 4px; }
.bt-fold canvas { height: 32px; width: auto; }
.bt-paper { margin: 10px 2px 2px; padding: 4px; background: var(--paper, #fde8f0); box-shadow: var(--ring2), 4px 6px 0 0 rgba(184, 58, 107, .14); }
.bt-paper textarea { display: block; width: 100%; border: 0; outline: none; resize: vertical; padding: 4px 10px; font-size: 22px; line-height: 32px; color: var(--ink); background: transparent;
  background-image: repeating-linear-gradient(transparent 0 31px, var(--ink-line, #f3cbda) 31px 32px); background-attachment: local; min-height: 168px; }
.bt-paper textarea::placeholder { color: var(--mute); font-size: 18px; }
.bt-count { text-align: right; font-size: 11px; color: var(--mute); margin: 4px 2px 0; }
.bt-shapes { display: flex; flex-wrap: wrap; gap: 6px; }
.bt-shape { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; border: 0; padding: 6px 2px 4px; background: #fff; font-size: 10px; box-shadow: 0 0 0 2px var(--line); margin: 2px; }
.bt-shape canvas { height: 18px; width: auto; }
.bt-shape.is-on { box-shadow: var(--ring2); background: var(--paper2); color: var(--pink-d); }
.bt-me { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bt-av canvas { width: 48px; height: 48px; background: var(--paper2); box-shadow: 0 0 0 2px var(--ink); }

.bt-form-foot { display: flex; justify-content: flex-end; margin-top: 12px; }

.bt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 18px; }
.bt-list[hidden] { display: none; }
.bt-item { display: flex; gap: 10px; align-items: center; text-align: left; border: 0; padding: 10px; background: var(--paper); box-shadow: var(--ring2); margin: 2px; min-width: 0; }

.bt-item span { display: flex; flex-direction: column; min-width: 0; }
.bt-item b { font: 400 13px var(--font-h); }
.bt-item i { font: 15px/1.3 var(--font-hand); font-style: normal; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-view { display: flex; flex-direction: column; gap: 14px; }
.note-paper { position: relative; padding: 18px 22px 16px; background: var(--paper); box-shadow: var(--ring2), 6px 9px 0 0 rgba(184, 58, 107, .18); margin: 4px;
  background-image: repeating-linear-gradient(transparent 0 35px, var(--ink-line) 35px 36px); background-position: 0 58px; }

.note-top { display: flex; justify-content: space-between; align-items: center; height: 44px; }

.note-av { width: 44px; height: 44px; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.note-msg { margin: 6px 0 12px; font-size: 24px; line-height: 36px; white-space: pre-wrap; word-break: break-word; min-height: 108px; }

.nv-c { font: 12px var(--font-h); color: var(--mute); }

/* ---------- 하단 / 토스트 ---------- */
.foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 44px; padding-top: 12px; border-top: 3px solid var(--ink); font: 11px var(--font-h); color: var(--mute); letter-spacing: .06em; }
.px-toast { position: absolute; left: 50%; bottom: 30px; top: auto; z-index: 95; transform: translate(-50%, 20px); padding: 8px 14px; background: var(--ink); color: #fff; font-size: 13px; opacity: 0; pointer-events: none;
  box-shadow: var(--ring3), 0 0 0 7px var(--pink-l); transition: opacity .2s steps(3), transform .2s steps(3); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.px-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 반응형 ---------- */
@media (max-width: 760px) {
  .handheld { grid-template-columns: 1fr 1fr; grid-template-areas: &quot;c c&quot; &quot;l r&quot;; padding: 14px 12px 18px; }
  .hh-center { grid-area: c; } .hh-left { grid-area: l; } .hh-right { grid-area: r; }
  .hh-left, .hh-right { gap: 12px; }
  .hh-dots, .hh-coin, .grill { display: none; }
  .game-side { grid-template-columns: 1fr; }
  .pola, .bt, .maker { grid-template-columns: 1fr; }
  .pl-stage, .mk-stage, .bt-left { max-width: 380px; margin: 0 auto; width: 100%; }
  .st-big { font-size: 46px; }
}
@media (max-width: 640px) {
  .px-app { padding: 0 12px 34px; }
  .marquee { margin: 0 -12px 20px; }
  .brand-text b { font-size: 16px; }
  .stage-tab { flex-direction: column; gap: 4px; font-size: 10px; }
  .stage-tab span { width: 24px; height: 24px; font-size: 13px; }
  .profiles { grid-template-columns: 1fr; }
  .profile-heart { width: 20px; height: 18px; }
  .mk-row { grid-template-columns: 1fr; gap: 4px; }
  .mk-label { padding-top: 0; }
  .dlg-text { font-size: 15px; }
  .foot { flex-direction: column; }
  .doc-title { font-size: 17px; }
  .xm-body { padding: 14px; }
  .st-big { display: none; }
}

/* ---------- 스크롤바 (픽셀) ---------- */
.px-app ::-webkit-scrollbar { width: 14px; height: 14px; }
.px-app ::-webkit-scrollbar-track { background: var(--paper2); background-image: linear-gradient(90deg, transparent 5px, var(--pink-l) 5px 9px, transparent 9px); }
.px-app ::-webkit-scrollbar-thumb { background: var(--pink); box-shadow: inset 0 0 0 2px var(--ink), inset 0 -4px 0 2px var(--pink-d), inset 0 3px 0 2px #f08cb0; border: 2px solid var(--paper2); }
.px-app ::-webkit-scrollbar-thumb:hover { background: #e66b97; }
.px-app ::-webkit-scrollbar-corner { background: var(--paper2); }
.px-app ::-webkit-scrollbar-button { display: none; }
@supports not selector(::-webkit-scrollbar) { .px-app, .px-app * { scrollbar-color: var(--pink) var(--paper2); scrollbar-width: thin; } }

/* ---------- BGM ---------- */
.top-ctrl { display: flex; align-items: center; gap: 10px; }
.bgm { display: flex; align-items: stretch; box-shadow: var(--ring3); background: #fff; margin: 3px; }
.bgm-btn { display: flex; align-items: center; gap: 8px; border: 0; padding: 0 10px; height: 36px; background: #fff; font: 11px var(--font-h); letter-spacing: .06em; color: var(--mute); max-width: 210px; }
.bgm-btn.is-on { color: var(--pink-d); }
.bgm-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bgm-btn.is-on .bgm-title { animation: none; }
.bgm-ico { flex: none; width: 14px; height: 14px; background: currentColor; clip-path: polygon(40% 0, 100% 0, 100% 22%, 55% 22%, 55% 80%, 45% 100%, 10% 100%, 0 82%, 10% 64%, 40% 62%); }
.bgm-btn.is-on .bgm-ico { animation: hop .5s steps(2) infinite; }
.bgm-next { border: 0; padding: 0 8px; background: var(--paper2); font: 10px var(--font-h); color: var(--ink2); box-shadow: inset 2px 0 0 var(--line); }
.bgm-next:hover { background: var(--pink-l); }

/* ---------- 수상 진열장 / 상장 ---------- */
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.shelf-head b { font: 400 15px var(--font-h); color: var(--pink-d); letter-spacing: .06em; }
.shelf-head span { font: 12px var(--font-h); color: var(--mute); }
.shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.award { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; padding: 10px 6px 8px; margin: 2px; background: var(--paper2); box-shadow: 0 0 0 2px var(--line); font-size: 11px; color: var(--mute); word-break: keep-all; text-align: center; }
.award i { width: 28px; height: 34px; background:
  linear-gradient(var(--line), var(--line)) 8px 0 / 4px 10px no-repeat, linear-gradient(var(--line), var(--line)) 16px 0 / 4px 10px no-repeat,
  radial-gradient(circle at 14px 22px, var(--line) 10px, transparent 11px); }
.award.got { background: #fff; color: var(--ink); box-shadow: var(--ring2), 3px 4px 0 0 var(--pink-l); }
.award.got i { background:
  linear-gradient(var(--p1), var(--p1)) 8px 0 / 4px 12px no-repeat, linear-gradient(var(--p2), var(--p2)) 16px 0 / 4px 12px no-repeat,
  radial-gradient(circle at 14px 22px, #fff2c4 3px, var(--gold) 4px, var(--gold) 9px, #a8742a 10px, transparent 11px); }
.award.got:hover { transform: translateY(-2px); }
.cert-modal .xm-win { width: min(820px, 100%); }
.cert-msg { margin: 0 0 12px; font: 15px var(--font-read); }
.cert-msg b { color: var(--pink-d); font-weight: 400; }
.cert-cv { width: 100%; height: auto; aspect-ratio: 760/540; box-shadow: 0 0 0 2px var(--ink); image-rendering: auto; }
.cert-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 14px; }
.cert-row .mk-label { padding: 0; }
@media (max-width: 640px) { .shelf { grid-template-columns: repeat(2, 1fr); } .bgm-btn { max-width: 120px; } .bgm-title { font-size: 9px; } }

    nav.innerHTML = `&lt;button type=&quot;button&quot; class=&quot;px-btn sm ghost nv-p&quot;&gt;◀ 이전&lt;/button&gt;&lt;span class=&quot;nv-c&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;px-btn sm ghost nv-n&quot;&gt;다음 ▶&lt;/button&gt;`;
    const slot = document.createElement(&quot;div&quot;); slot.className = &quot;note-slot&quot;;
    body.append(slot, nav);
    const show = () =&gt; {
      const e = entries[i]; slot.innerHTML = &quot;&quot;; const n = noteEl(e); n.classList.add(&quot;unfold&quot;); slot.appendChild(n);
      nav.querySelector(&quot;.nv-c&quot;).textContent = `${i + 1} / ${entries.length}`;
      nav.querySelector(&quot;.nv-p&quot;).disabled = i &lt;= 0; nav.querySelector(&quot;.nv-n&quot;).disabled = i &gt;= entries.length - 1;
    };
    const m = PX.ui.modal({ title: &quot;NOTE.TXT — 쪽지 펼치기&quot;, body, cls: &quot;note-modal&quot; });
    nav.querySelector(&quot;.nv-p&quot;).onclick = () =&gt; { if (i &gt; 0) { i--; show(); PX.sfx(&quot;move&quot;); } };
    nav.querySelector(&quot;.nv-n&quot;).onclick = () =&gt; { if (i &lt; entries.length - 1) { i++; show(); PX.sfx(&quot;move&quot;); } };
    const key = (e) =&gt; { if (!document.body.contains(body)) return document.removeEventListener(&quot;keydown&quot;, key); if (e.key === &quot;ArrowLeft&quot;) nav.querySelector(&quot;.nv-p&quot;).click(); if (e.key === &quot;ArrowRight&quot;) nav.querySelector(&quot;.nv-n&quot;).click(); };
    document.addEventListener(&quot;keydown&quot;, key);
    show(); PX.sfx(&quot;paint&quot;);
  }
  function buildList() {
    const box = PX.$(&quot;.bt-list&quot;, root); if (!box) return;
    box.innerHTML = &quot;&quot;;
    entries.slice().reverse().forEach((e) =&gt; {
      const b = document.createElement(&quot;button&quot;); b.type = &quot;button&quot;; b.className = &quot;bt-item&quot;;
      b.style.setProperty(&quot;--paper&quot;, PX.tint(e.color || &quot;#f8bfd3&quot;, 0.72));
      b.appendChild(shapeIcon(e.shape || &quot;crane&quot;, e.color || &quot;#f8bfd3&quot;, 2));
      const s = document.createElement(&quot;span&quot;); s.innerHTML = `&lt;b&gt;&lt;/b&gt;&lt;i&gt;&lt;/i&gt;`;
      s.querySelector(&quot;b&quot;).textContent = e.name; s.querySelector(&quot;i&quot;).textContent = e.message.slice(0, 40);
      b.appendChild(s); b.onclick = () =&gt; openNote(entries.indexOf(e));
      box.appendChild(b);
    });
  }

  /* ---------- 작성 폼 ---------- */
  function buildForm() {
    const shapes = PX.$(&quot;.bt-shapes&quot;, root); shapes.innerHTML = &quot;&quot;;
    PX.origami.list.forEach((o) =&gt; {
      const b = document.createElement(&quot;button&quot;); b.type = &quot;button&quot;; b.className = &quot;bt-shape&quot; + (draft.shape === o.id ? &quot; is-on&quot; : &quot;&quot;); b.title = o.name;
      b.appendChild(shapeIcon(o.id, draft.color, 2)); const s = document.createElement(&quot;span&quot;); s.textContent = o.name; b.appendChild(s);
      b.onclick = () =&gt; { draft.shape = o.id; saveDraft(); buildForm(); PX.sfx(&quot;move&quot;); };
      shapes.appendChild(b);
    });
    const sw = PX.$(&quot;.bt-colors&quot;, root); sw.innerHTML = &quot;&quot;;
    PX.origami.COLORS.forEach((c) =&gt; {
      const b = document.createElement(&quot;button&quot;); b.type = &quot;button&quot;; b.className = &quot;sw&quot; + (draft.color === c ? &quot; is-on&quot; : &quot;&quot;); b.style.setProperty(&quot;--c&quot;, c);
      b.onclick = () =&gt; { draft.color = c; saveDraft(); buildForm(); PX.sfx(&quot;move&quot;); };
      sw.appendChild(b);
    });
    sw.appendChild(PX.ui.colorButton({ value: draft.color, cls: &quot;sw-custom&quot; + (PX.origami.COLORS.includes(draft.color) ? &quot;&quot; : &quot; is-on&quot;),
      onInput: (c) =&gt; { draft.color = c; preview(); }, onCommit: (c) =&gt; { draft.color = c; saveDraft(); buildForm(); } }));
    preview();
  }
  function preview() {
    const ta = PX.$(&quot;textarea[name=message]&quot;, root);
    ta.style.fontFamily = `&quot;${draft.font}&quot;, &quot;Galmuri11&quot;, sans-serif`;
    ta.parentElement.style.setProperty(&quot;--paper&quot;, PX.tint(draft.color, 0.72));
    ta.parentElement.style.setProperty(&quot;--ink-line&quot;, PX.tint(PX.shade(draft.color, 0.1), 0.35));
    const pv = PX.$(&quot;.bt-fold&quot;, root); pv.innerHTML = &quot;&quot;; pv.appendChild(shapeIcon(draft.shape, draft.color, 4));
    const av = PX.$(&quot;.bt-av&quot;, root); av.innerHTML = &quot;&quot;; av.appendChild(avatar(draft.attach ? PX.maker.encode() : null));
    PX.$(&quot;.bt-attach&quot;, root).classList.toggle(&quot;is-on&quot;, draft.attach);
  }
  const saveDraft = () =&gt; PX.store.set(&quot;noteDraft&quot;, draft);
  async function submit(e) {
    e.preventDefault();
    const f = e.target, name = f.name.value.trim(), message = f.message.value.trim();
    if (!name || !message) return PX.toast(&quot;이름과 쪽지 내용을 모두 적어 주세요&quot;);
    const last = PX.store.get(&quot;gbLast&quot;, 0);
    if (Date.now() - last &lt; COOLDOWN) return PX.toast(`조금만 기다렸다가 다시 넣어 주세요 (${Math.ceil((COOLDOWN - (Date.now() - last)) / 1000)}초)`);
    if (!fb) return PX.toast(&quot;방명록 서버에 연결 중이에요. 잠시 후 다시 시도해 주세요&quot;);
    const btn = PX.$(&quot;.bt-submit&quot;, f); btn.disabled = true; btn.textContent = &quot;접는 중…&quot;;
    try {
      const data = { name: name.slice(0, 12), message: message.slice(0, 200), shape: draft.shape, color: draft.color.toLowerCase(), font: draft.font, createdAt: fb.serverTimestamp() };
      if (draft.attach) data.avatar = PX.maker.encode();
      await fb.addDoc(col, data);
      PX.store.set(&quot;gbLast&quot;, Date.now()); PX.store.set(&quot;gbName&quot;, name);
      f.message.value = &quot;&quot;; count();
      PX.sfx(&quot;send&quot;); PX.toast(&quot;쪽지를 병에 넣었어요. 고마워요!&quot;);
    } catch (err) { console.error(err); PX.sfx(&quot;hit&quot;); PX.toast(&quot;저장에 실패했어요 (&quot; + (err.code || &quot;error&quot;) + &quot;)&quot;); }
    finally { btn.disabled = false; btn.textContent = &quot;쪽지 접어서 병에 넣기&quot;; }
  }
  const count = () =&gt; { PX.$(&quot;.bt-count&quot;, root).textContent = `${PX.$(&quot;textarea[name=message]&quot;, root).value.length}/200`; };

  function mount(el) {
    root = el;
    jar = PX.$(&quot;.bt-jar&quot;, el); jx = jar.getContext(&quot;2d&quot;);
    const form = PX.$(&quot;.bt-form&quot;, el);
    form.name.value = PX.store.get(&quot;gbName&quot;, &quot;&quot;);
    form.addEventListener(&quot;submit&quot;, submit);
    form.message.addEventListener(&quot;input&quot;, count);
    form.message.addEventListener(&quot;keydown&quot;, (e) =&gt; { if (e.key === &quot;Enter&quot; &amp;&amp; (e.ctrlKey || e.metaKey)) form.requestSubmit(); });
    PX.$(&quot;.bt-fontslot&quot;, el).appendChild(PX.ui.select({ options: NOTE_FONTS, value: draft.font, fontPreview: true, onChange: (v) =&gt; { draft.font = v; saveDraft(); preview(); } }));
    PX.$(&quot;.bt-attach&quot;, el).onclick = () =&gt; { draft.attach = !draft.attach; saveDraft(); preview(); PX.sfx(&quot;move&quot;); };
    PX.$(&quot;.bt-edit&quot;, el).onclick = () =&gt; PX.goStage(3);
    PX.$(&quot;.bt-prev&quot;, el).onclick = () =&gt; { if (bottleIdx &gt; 0) { bottleIdx--; updateTag(); PX.sfx(&quot;move&quot;); } };
    PX.$(&quot;.bt-next&quot;, el).onclick = () =&gt; { if (bottleIdx &lt; Math.ceil(entries.length / PER) - 1) { bottleIdx++; updateTag(); PX.sfx(&quot;move&quot;); } };
    PX.$(&quot;.bt-listbtn&quot;, el).onclick = () =&gt; { const l = PX.$(&quot;.bt-list&quot;, el); l.hidden = !l.hidden; PX.$(&quot;.bt-listbtn&quot;, el).textContent = l.hidden ? &quot;쪽지 목록 펼치기&quot; : &quot;쪽지 목록 접기&quot;; };
    const pick = (e) =&gt; {
      const r = jar.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * JW, py = ((e.clientY - r.top) / r.height) * JH;
      const lay = layout(current());
      for (let i = lay.length - 1; i &gt;= 0; i--) { const p = lay[i]; if (px &gt;= p.x - 1 &amp;&amp; px &lt;= p.x + 21 &amp;&amp; py &gt;= p.y - 2 &amp;&amp; py &lt;= p.y + 12) return i; }
      return -1;
    };
    jar.addEventListener(&quot;pointermove&quot;, (e) =&gt; { hover = pick(e); jar.style.cursor = hover &gt;= 0 ? &quot;pointer&quot; : &quot;default&quot;; });
    jar.addEventListener(&quot;pointerleave&quot;, () =&gt; (hover = -1));
    jar.addEventListener(&quot;click&quot;, (e) =&gt; { const i = pick(e); if (i &gt;= 0) openNote(bottleIdx * PER + i); });
    PX.maker.onChange(preview);
    buildForm(); count(); updateTag();
    status(&quot;병을 여는 중…&quot;);
    init().then(listen).catch((err) =&gt; { console.error(err); status(&quot;방명록 서버에 연결하지 못했어요. 네트워크 상태를 확인해 주세요.&quot;); });
  }
  PX.bottle = {
    mount,
    show() { if (!running) { running = true; raf = requestAnimationFrame(loop); } },
    hide() { running = false; }
  };
})();

&lt;script&gt;
/* =========================================================
   MAIN — 스테이지 전환 / 장식 / 초기화
   ========================================================= */
(function () {
  const PX = window.PX, CFG = window.SITE_CONFIG;
  const GAME_HELP = {
    runner: { t: &quot;1 · JUMP RUN&quot;, d: &quot;시작 전 ←→로 산타·오리온을 골라요. 블록을 넘으며 끝까지 달리면 상대가 기다리고 있어요. A를 길게 누르면 더 높이, 공중에서 ↓를 누르면 빨리 내려와요.&quot; },
    catch: { t: &quot;2 · SWEET CATCH&quot;, d: &quot;60초 동안 핫초코와 케이크(+10), 하트(+30)를 받아요. 산타가 못 마시는 쓴 커피와 산타가 태운 토스트는 피하세요! 목숨 3개로 버티면 엔딩.&quot; },
    stack: { t: &quot;3 · CAKE STACK&quot;, d: &quot;움직이는 케이크 층을 A로 떨어뜨려 15층 웨딩 케이크를 완성해요. PERFECT 3연속이면 층이 다시 넓어져요.&quot; },
    brick: { t: &quot;4 · BRICK BREAK&quot;, d: &quot;←→로 받침대, A로 발사. 하트 → 1 → 격자 → 마지막 판까지 4판을 모두 깨면 엔딩이에요.&quot; }
  };


  let cur = 1;
  PX.goStage = function (n) {
    cur = n;
    PX.$$(&quot;.stage&quot;).forEach((s) =&gt; s.classList.toggle(&quot;is-active&quot;, +s.dataset.stage === n));
    PX.$$(&quot;.stage-tab&quot;).forEach((b) =&gt; {
      const on = +b.dataset.go === n;
      b.classList.toggle(&quot;is-on&quot;, on); b.setAttribute(&quot;aria-selected&quot;, on);
      if (+b.dataset.go &lt; n) b.classList.add(&quot;is-cleared&quot;);
    });
    n === 1 ? PX.intro.show() : PX.intro.hide();
    n === 5 ? PX.bottle.show() : PX.bottle.hide();
    PX.games.setActive(n === 2);
    if (n === 4) PX.polaroid.render();
    PX.ui.colorPicker.close();
    PX.sfx(&quot;select&quot;);
    const app = PX.$(&quot;.px-app&quot;), top = app.getBoundingClientRect().top;
    if (top &lt; 0) window.scrollBy({ top: top - 8, behavior: &quot;smooth&quot; });
    try { const fe = window.frameElement; if (fe &amp;&amp; fe.getBoundingClientRect().top &lt; 0) fe.scrollIntoView({ behavior: &quot;smooth&quot;, block: &quot;start&quot; }); } catch (e) {}
  };

  function decorate() {
    const app = PX.$(&quot;.px-app&quot;);
    const L = [&quot;################&quot;, &quot;################&quot;, &quot;###..######..###&quot;, &quot;################&quot;, &quot;.##############.&quot;, &quot;..############..&quot;, &quot;....########....&quot;, &quot;......####......&quot;];
    const c = document.createElement(&quot;canvas&quot;); c.width = 16; c.height = L.length;
    const x = c.getContext(&quot;2d&quot;); x.fillStyle = &quot;#ffffff&quot;;
    L.forEach((r, j) =&gt; r.split(&quot;&quot;).forEach((ch, i) =&gt; ch === &quot;#&quot; &amp;&amp; x.fillRect(i, j, 1, 1)));
    app.style.setProperty(&quot;--lace&quot;, `url(${c.toDataURL()})`);
    const icon = (rows, col) =&gt; { const k = document.createElement(&quot;canvas&quot;); k.width = 5; k.height = 5; const kx = k.getContext(&quot;2d&quot;); kx.fillStyle = col; rows.forEach((r, j) =&gt; r.split(&quot;&quot;).forEach((ch, i) =&gt; ch === &quot;#&quot; &amp;&amp; kx.fillRect(i, j, 1, 1))); return k.toDataURL(); };
    const SPARK = [&quot;..#..&quot;, &quot;..#..&quot;, &quot;#####&quot;, &quot;..#..&quot;, &quot;..#..&quot;], HRT = [&quot;.#.#.&quot;, &quot;#####&quot;, &quot;#####&quot;, &quot;.###.&quot;, &quot;..#..&quot;];
    const imgs = [icon(SPARK, &quot;#ffffff&quot;), icon(HRT, &quot;#f08cb0&quot;), icon(SPARK, &quot;#f6b4cb&quot;), icon(HRT, &quot;#ffffff&quot;)];
    const spots = [[2, 12], [97, 8], [1, 34], [98, 28], [2, 58], [97, 52], [1, 82], [98, 76], [50, 1], [30, 99], [72, 98], [98, 95]];
    const d = PX.$(&quot;.decor&quot;);
    spots.forEach(([l, t], i) =&gt; { const e = document.createElement(&quot;i&quot;); e.style.cssText = `left:${l}%;top:${t}%;background-image:url(${imgs[i % 4]});animation-delay:${(i * 0.37) % 2}s`; if (i % 3 === 0) e.classList.add(&quot;big&quot;); d.appendChild(e); });
    // 마퀴
    const mq = PX.$(&quot;.marquee span&quot;);
    const unit = `SANTA ♥ ORION · 1ST ANNIVERSARY · 2025.11.28 — 2026.11.28 · DAY ${PX.daysSinceStart()} · SANRION SAVE FILE · `;
    mq.textContent = unit.repeat(6);
  }

  /* iframe에 넣었을 때 높이 자동 맞춤 (스크롤바 없이) */
  function autoHeight() {
    if (window.parent === window) return;
    const send = () =&gt; {
      const h = Math.ceil(PX.$(&quot;.px-app&quot;).getBoundingClientRect().height);
      try { if (window.frameElement) window.frameElement.style.height = h + &quot;px&quot;; } catch (e) {}
      try { window.parent.postMessage({ sanrionHeight: h }, &quot;*&quot;); } catch (e) {}
    };
    try { new ResizeObserver(send).observe(PX.$(&quot;.px-app&quot;)); } catch (e) { setInterval(send, 1000); }
    send();
  }

  function init() {
    decorate();
    PX.$$(&quot;[data-site-name]&quot;).forEach((e) =&gt; (e.textContent = CFG.siteNameKo));
    PX.$$(&quot;[data-console-label]&quot;).forEach((e) =&gt; (e.textContent = CFG.consoleLabel));
    PX.$$(&quot;.stage-tab&quot;).forEach((b) =&gt; b.addEventListener(&quot;click&quot;, () =&gt; PX.goStage(+b.dataset.go)));
    PX.$$(&quot;[data-next]&quot;).forEach((b) =&gt; b.addEventListener(&quot;click&quot;, () =&gt; PX.goStage(+b.dataset.next)));
    // BGM
    const bgmBtn = PX.$(&quot;.bgm-btn&quot;), bgmTitle = PX.$(&quot;.bgm-title&quot;);
    const paintBgm = () =&gt; { const on = PX.music.isPlaying(); bgmBtn.classList.toggle(&quot;is-on&quot;, on); bgmTitle.textContent = on ? PX.music.title() : &quot;BGM OFF&quot;; };
    PX.music.onChange(paintBgm); paintBgm();
    bgmBtn.addEventListener(&quot;click&quot;, () =&gt; { PX.music.setEnabled(!PX.music.isPlaying()); paintBgm(); });
    PX.$(&quot;.bgm-next&quot;).addEventListener(&quot;click&quot;, () =&gt; { if (!PX.music.isPlaying()) PX.music.setEnabled(true); else PX.music.next(); paintBgm(); });
    const snd = PX.$(&quot;.sound-btn&quot;);
    const paintSnd = () =&gt; { snd.classList.toggle(&quot;is-off&quot;, PX.muted); snd.title = PX.muted ? &quot;소리 켜기&quot; : &quot;소리 끄기&quot;; snd.setAttribute(&quot;aria-label&quot;, snd.title); };
    snd.addEventListener(&quot;click&quot;, () =&gt; { PX.muted = !PX.muted; PX.store.set(&quot;muted&quot;, PX.muted); paintSnd(); PX.unlockAudio(); PX.sfx(&quot;blip&quot;); });
    paintSnd();

    PX.intro.prepare();
    PX.maker.mount(PX.$(&quot;.maker&quot;));
    PX.intro.mount(PX.$(&#x27;.stage[data-stage=&quot;1&quot;]&#x27;));
    PX.games.mount(PX.$(&quot;.handheld&quot;));
    PX.polaroid.mount(PX.$(&quot;.pola&quot;));
    PX.bottle.mount(PX.$(&#x27;.stage[data-stage=&quot;5&quot;]&#x27;));

    const help = PX.$(&quot;.game-help&quot;);
    const setHelp = (id) =&gt; { const h = GAME_HELP[id]; if (h) { PX.$(&quot;b&quot;, help).textContent = h.t; PX.$(&quot;p&quot;, help).textContent = h.d; } };
    PX.games.onSelect(setHelp); setHelp(&quot;runner&quot;);

    autoHeight();
    PX.intro.show();
    const shelf = PX.$(&quot;.awards&quot;); PX.cert.renderShelf(shelf); PX.cert.onChange(() =&gt; PX.cert.renderShelf(shelf));
    PX.entryIntro(PX.$(&quot;.intro&quot;), () =&gt; { PX.intro.start(); PX.music.startIfEnabled(); });
  }
  if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, init); else init();
})();
